name: medrive_workspace
description: Monorepo Flutter MeDrive (aplikasi pelapor MeDrive dan aplikasi driver MeDriveR) dengan paket core dan ui bersama.
publish_to: none

environment:
  sdk: ^3.13.5

workspace:
  - apps/medrive
  - apps/medriver
  - packages/core
  - packages/ui

dev_dependencies:
  flutter_lints: ^6.0.0
