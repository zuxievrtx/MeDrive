name: medriver
description: MeDriveR - aplikasi driver ambulans MeDrive (shift, tawaran dispatch, misi, ping lokasi).
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.8.0
  medrive_core:
    path: ../../packages/core
  medrive_ui:
    path: ../../packages/ui
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  battery_plus: ^7.1.2
  permission_handler: ^13.0.2
  wakelock_plus: ^1.8.0
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.2
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  cached_network_image: ^4.0.4
  intl: ^0.20.3
  uuid: ^4.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dio: ^5.11.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
