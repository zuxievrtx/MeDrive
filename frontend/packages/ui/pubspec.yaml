name: medrive_ui
description: Design system MeDrive - token warna, tema, dan widget bersama untuk aplikasi pelapor dan driver.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.8.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  cached_network_image: ^4.0.4
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-400.ttf
        - asset: fonts/Nunito-600.ttf
          weight: 600
        - asset: fonts/Nunito-700.ttf
          weight: 700
        - asset: fonts/Nunito-800.ttf
          weight: 800
        - asset: fonts/Nunito-900.ttf
          weight: 900
