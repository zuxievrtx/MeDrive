name: medrive_core
description: Fondasi bersama aplikasi MeDrive & MeDriveR - API client, model, penyimpanan token, websocket Reverb, FCM, ping lokasi driver.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  dart_pusher_channels: ^1.3.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  fake_async: ^1.3.3
