openapi: 3.0.3
info:
  title: 'Medrive API v1'
  description: 'API untuk aplikasi Pelapor, aplikasi Driver, dan dashboard Admin Medrive.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Autentikasi
    description: ''
  -
    name: Pelapor
    description: ''
  -
    name: Driver
    description: ''
  -
    name: Admin
    description: ''
  -
    name: 'Berkas privat'
    description: ''
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Token didapat dari <code>POST /api/v1/auth/login</code> (pelapor/driver). Endpoint admin memakai cookie session dashboard.'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: 'Daftar akun pelapor'
      operationId: daftarAkunPelapor
      description: 'Role selalu pelapor; driver hanya didaftarkan admin. Mengembalikan token Sanctum (ability reporter).'
      parameters: []
      responses: {  }
      tags:
        - Autentikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                phone:
                  type: string
                  description: 'Must match the regex /^[0-9+\-\s]{8,20}$/. Must not be greater than 20 characters.'
                  example: ngzmiyvdljnikhwa
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 100 characters.'
                  example: breitenberg.gilbert@example.com
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                device_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: v
                  nullable: true
              required:
                - name
                - phone
                - email
                - password
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Masuk (pelapor / driver)'
      operationId: masukpelaporDriver
      description: 'Akun admin ditolak (admin_use_dashboard). Token membawa ability sesuai role: reporter atau driver.'
      parameters: []
      responses: {  }
      tags:
        - Autentikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                device_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: v
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Keluar (mencabut token yang dipakai)'
      operationId: keluarmencabutTokenYangDipakai
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Autentikasi
  /api/v1/auth/fcm:
    post:
      summary: 'Daftarkan / perbarui token FCM perangkat'
      operationId: daftarkanPerbaruiTokenFCMPerangkat
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Autentikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fcm_token:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                platform:
                  type: string
                  description: ''
                  example: web
                  enum:
                    - android
                    - ios
                    - web
                device_model:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: 'n'
                  nullable: true
                app_version:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: gzmiyvdljnikhway
                  nullable: true
              required:
                - fcm_token
                - platform
  /api/v1/auth/change-password:
    post:
      summary: 'Ganti password'
      operationId: gantiPassword
      description: 'Wajib saat must_change_password = true. Token lain milik akun dicabut.'
      parameters: []
      responses: {  }
      tags:
        - Autentikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  description: ''
                  example: architecto
                password:
                  type: string
                  description: 'The value and <code>current_password</code> must be different.'
                  example: '|]|{+-'
              required:
                - current_password
                - password
  /api/v1/me:
    get:
      summary: 'Profil akun yang sedang masuk'
      operationId: profilAkunYangSedangMasuk
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Autentikasi
  /api/v1/reporter/reports:
    post:
      summary: ''
      operationId: postApiV1ReporterReports
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Pelapor
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                report_type_code:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
                latitude:
                  type: number
                  description: 'Must be between -90 and 90.'
                  example: -89
                longitude:
                  type: number
                  description: 'Must be between -180 and 180.'
                  example: -180
                address:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: z
                  nullable: true
                description:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: 'Velit et fugiat sunt nihil accusantium.'
                destination_clinic_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                  nullable: true
                destination_name:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: 'n'
                  nullable: true
                destination_address:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                  nullable: true
                destination_lat:
                  type: number
                  description: 'This field is required when <code>destination_lng</code> is present. Must be between -90 and 90.'
                  example: -89
                  nullable: true
                destination_lng:
                  type: number
                  description: 'This field is required when <code>destination_lat</code> is present. Must be between -180 and 180.'
                  example: -180
                  nullable: true
                photos:
                  type: array
                  description: 'Must be an image. Must not be greater than 2048 kilobytes.'
                  items:
                    type: string
                    format: binary
                death_certificate:
                  type: string
                  format: binary
                  description: 'Must be a file. Must not be greater than 2048 kilobytes.'
                  nullable: true
              required:
                - report_type_code
                - latitude
                - longitude
                - description
    get:
      summary: ''
      operationId: getApiV1ReporterReports
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Pelapor
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: ''
                  example: null
                  nullable: true
                type:
                  type: string
                  description: 'Must not be greater than 30 characters.'
                  example: b
                  nullable: true
  /api/v1/reporter/clinics:
    get:
      summary: ''
      operationId: getApiV1ReporterClinics
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Pelapor
  '/api/v1/reporter/reports/{id}':
    get:
      summary: ''
      operationId: getApiV1ReporterReportsId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Pelapor
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the report.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/reporter/reports/{report_id}/driver-location':
    get:
      summary: 'Posisi ambulans live untuk fallback polling (websocket report.{id} adalah jalur utama).'
      operationId: posisiAmbulansLiveUntukFallbackPollingwebsocketReportidAdalahJalurUtama
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Pelapor
    parameters:
      -
        in: path
        name: report_id
        description: 'The ID of the report.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/driver/location:
    post:
      summary: ''
      operationId: postApiV1DriverLocation
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Driver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                points:
                  type: object
                  description: 'Must have at least 1 items. Must not have more than 10 items.'
                  example: []
                  properties: {  }
                device:
                  type: object
                  description: ''
                  example: null
                  properties:
                    fcm_token:
                      type: string
                      description: 'Must not be greater than 255 characters.'
                      example: b
                      nullable: true
                    app_version:
                      type: string
                      description: 'Must not be greater than 20 characters.'
                      example: ngzmiyvdljnikhwa
                      nullable: true
                    device_model:
                      type: string
                      description: 'Must not be greater than 100 characters.'
                      example: 'y'
                      nullable: true
                  nullable: true
              required:
                - points
  /api/v1/driver/profile:
    get:
      summary: ''
      operationId: getApiV1DriverProfile
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Driver
  /api/v1/driver/ambulances/available:
    get:
      summary: ''
      operationId: getApiV1DriverAmbulancesAvailable
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Driver
  /api/v1/driver/shifts:
    post:
      summary: ''
      operationId: postApiV1DriverShifts
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Driver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ambulance_id:
                  type: integer
                  description: ''
                  example: 16
              required:
                - ambulance_id
  /api/v1/driver/shifts/close:
    post:
      summary: ''
      operationId: postApiV1DriverShiftsClose
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Driver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 'Must be at least 3 characters. Must not be greater than 255 characters.'
                  example: b
              required:
                - reason
  /api/v1/driver/dispatches/active:
    get:
      summary: ''
      operationId: getApiV1DriverDispatchesActive
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Driver
  '/api/v1/driver/dispatches/{id}':
    get:
      summary: ''
      operationId: getApiV1DriverDispatchesId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Driver
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the dispatch.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/driver/dispatches/{dispatch_id}/accept':
    post:
      summary: ''
      operationId: postApiV1DriverDispatchesDispatch_idAccept
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Driver
    parameters:
      -
        in: path
        name: dispatch_id
        description: 'The ID of the dispatch.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/driver/reports/history:
    get:
      summary: ''
      operationId: getApiV1DriverReportsHistory
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Driver
  '/api/v1/driver/reports/{id}':
    get:
      summary: ''
      operationId: getApiV1DriverReportsId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Driver
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the report.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/driver/reports/{report_id}/status':
    post:
      summary: ''
      operationId: postApiV1DriverReportsReport_idStatus
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Driver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: ''
                  example: dalam_perjalanan
                  enum:
                    - dalam_perjalanan
                    - tiba_di_lokasi
                    - mengantar_pasien
                    - selesai
                latitude:
                  type: number
                  description: 'This field is required when <code>longitude</code> is present. Must be between -90 and 90.'
                  example: -89
                  nullable: true
                longitude:
                  type: number
                  description: 'This field is required when <code>latitude</code> is present. Must be between -180 and 180.'
                  example: -179
                  nullable: true
                note:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                  nullable: true
              required:
                - status
    parameters:
      -
        in: path
        name: report_id
        description: 'The ID of the report.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/driver/reports/{report_id}/patients':
    post:
      summary: ''
      operationId: postApiV1DriverReportsReport_idPatients
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Driver
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                  nullable: true
                gender:
                  type: string
                  description: ''
                  example: P
                  enum:
                    - L
                    - P
                  nullable: true
                age_estimate:
                  type: integer
                  description: 'Must be between 0 and 130.'
                  example: 1
                  nullable: true
                consciousness:
                  type: string
                  description: ''
                  example: sadar
                  enum:
                    - sadar
                    - tidak_sadar
                    - tidak_diketahui
                  nullable: true
                is_breathing:
                  type: boolean
                  description: ''
                  example: false
                  nullable: true
                condition_note:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                  nullable: true
                handed_over_to:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: z
                  nullable: true
                handed_over_at:
                  type: string
                  description: 'Must be a valid date. Must be a date before or equal to <code>now</code>.'
                  example: '2022-11-09'
                  nullable: true
    parameters:
      -
        in: path
        name: report_id
        description: 'The ID of the report.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/driver/patients/{id}':
    put:
      summary: ''
      operationId: putApiV1DriverPatientsId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Driver
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                  nullable: true
                gender:
                  type: string
                  description: ''
                  example: P
                  enum:
                    - L
                    - P
                  nullable: true
                age_estimate:
                  type: integer
                  description: 'Must be between 0 and 130.'
                  example: 1
                  nullable: true
                consciousness:
                  type: string
                  description: ''
                  example: tidak_diketahui
                  enum:
                    - sadar
                    - tidak_sadar
                    - tidak_diketahui
                  nullable: true
                is_breathing:
                  type: boolean
                  description: ''
                  example: false
                  nullable: true
                condition_note:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                  nullable: true
                handed_over_to:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: z
                  nullable: true
                handed_over_at:
                  type: string
                  description: 'Must be a valid date. Must be a date before or equal to <code>now</code>.'
                  example: '2022-11-09'
                  nullable: true
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the patient.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/driver/reports/{report_id}/attachments':
    post:
      summary: ''
      operationId: postApiV1DriverReportsReport_idAttachments
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Driver
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photos:
                  type: array
                  description: 'Must be an image. Must not be greater than 2048 kilobytes.'
                  items:
                    type: string
                    format: binary
    parameters:
      -
        in: path
        name: report_id
        description: 'The ID of the report.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/admin/reports/export:
    get:
      summary: ''
      operationId: getApiV1AdminReportsExport
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Admin
  /api/v1/admin/statistics/export:
    get:
      summary: ''
      operationId: getApiV1AdminStatisticsExport
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Admin
  /api/v1/admin/dashboard/summary:
    get:
      summary: ''
      operationId: getApiV1AdminDashboardSummary
      description: ''
      parameters: []
      responses: {  }
      tags:
