      parameters: []
      responses: {  }
      tags:
        - Admin
  /api/v1/admin/escalations:
    get:
      summary: ''
      operationId: getApiV1AdminEscalations
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Admin
  /api/v1/admin/options:
    get:
      summary: ''
      operationId: getApiV1AdminOptions
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Admin
  '/api/v1/admin/drivers/{driver_id}/shifts':
    get:
      summary: ''
      operationId: getApiV1AdminDriversDriver_idShifts
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Admin
    parameters:
      -
        in: path
        name: driver_id
        description: 'The ID of the driver.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/admin/drivers/{driver_id}/reports':
    get:
      summary: ''
      operationId: getApiV1AdminDriversDriver_idReports
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Admin
    parameters:
      -
        in: path
        name: driver_id
        description: 'The ID of the driver.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/admin/drivers/{driver_id}/reset-password':
    post:
      summary: ''
      operationId: postApiV1AdminDriversDriver_idResetPassword
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                  nullable: true
    parameters:
      -
        in: path
        name: driver_id
        description: 'The ID of the driver.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/admin/drivers/{driver_id}/deactivate':
    post:
      summary: ''
      operationId: postApiV1AdminDriversDriver_idDeactivate
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Admin
    parameters:
      -
        in: path
        name: driver_id
        description: 'The ID of the driver.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/admin/drivers/{driver_id}/activate':
    post:
      summary: ''
      operationId: postApiV1AdminDriversDriver_idActivate
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Admin
    parameters:
      -
        in: path
        name: driver_id
        description: 'The ID of the driver.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/admin/drivers/{driver_id}/shifts/{shift_id}/end':
    post:
      summary: ''
      operationId: postApiV1AdminDriversDriver_idShiftsShift_idEnd
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Admin
    parameters:
      -
        in: path
        name: driver_id
        description: 'The ID of the driver.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: shift_id
        description: 'The ID of the shift.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/admin/drivers/{driver_id}/certifications':
    post:
      summary: ''
      operationId: postApiV1AdminDriversDriver_idCertifications
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                certificate_number:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: 'n'
                  nullable: true
                issuer:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: g
                  nullable: true
                issued_at:
                  type: string
                  description: 'Must be a valid date. Must be a date before or equal to <code>today</code>.'
                  example: '2022-11-09'
                expires_at:
                  type: string
                  description: 'Must be a valid date. Must be a date after <code>issued_at</code>.'
                  example: '2052-11-08'
                  nullable: true
                file:
                  type: string
                  format: binary
                  description: 'Must be a file. Must not be greater than 5120 kilobytes.'
                  nullable: true
              required:
                - name
                - issued_at
    parameters:
      -
        in: path
        name: driver_id
        description: 'The ID of the driver.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/admin/drivers:
    get:
      summary: ''
      operationId: getApiV1AdminDrivers
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                  nullable: true
                clinic_id:
                  type: integer
                  description: ''
                  example: 16
                  nullable: true
                institution_id:
                  type: integer
                  description: ''
                  example: 16
                  nullable: true
                shift:
                  type: string
                  description: ''
                  example: tidak
                  enum:
                    - aktif
                    - tidak
                  nullable: true
                status:
                  type: string
                  description: ''
                  example: aktif
                  enum:
                    - aktif
                    - nonaktif
                  nullable: true
                sort:
                  type: string
                  description: ''
                  example: null
                  nullable: true
                direction:
                  type: string
                  description: ''
                  example: asc
                  enum:
                    - asc
                    - desc
                  nullable: true
    post:
